services:
  uit-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uit_assistant_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-UIT Assistant}
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
